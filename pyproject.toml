[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wowregister"
version = "0.2.0"
description = "Windows character-registration macros with device-bound online licensing"
requires-python = ">=3.11"
dependencies = ["Pillow>=10,<13"]

[project.scripts]
wowregister-record = "wowregister.registration.record:main"
wowregister-replay = "wowregister.registration.replay:main"
wowregister-activate = "wowregister.licensing.client:main"

[tool.setuptools.packages.find]
include = ["wowregister*"]
exclude = ["wowregister.tests*"]
