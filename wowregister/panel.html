<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wowregister · 角色注册助手</title>
<style>
:root{font-family:"Microsoft YaHei",system-ui,sans-serif;color:#172b3d;background:#f0f4f8;font-size:15px}*{box-sizing:border-box}body{margin:0}main{max-width:830px;margin:44px auto;padding:0 24px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:26px}.brand{color:#17856a;font-size:12px;font-weight:750;letter-spacing:2px}h1{font-size:29px;margin:6px 0 0;letter-spacing:-1px}.muted{color:#687b8c;font-size:13px;line-height:1.7}.card{background:white;border:1px solid #e0e7ee;border-radius:16px;padding:25px 28px;box-shadow:0 5px 22px #22384f05;margin-bottom:18px}h2{font-size:16px;margin:0 0 17px}.row{display:flex;gap:12px;align-items:center}.grow{flex:1;min-width:0}input{font:inherit;border:1px solid #cfd9e2;border-radius:8px;padding:11px 12px;background:white;color:inherit;min-width:0}input:focus{outline:3px solid #1c997b22;border-color:#18886d}button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:12px 21px;font-weight:650;white-space:nowrap}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:#167b62;color:white}.secondary{background:#eef3f7;color:#294558}.quiet{background:transparent;color:#6b7d8b;padding:9px 0;font-size:13px}.badge{font-size:12px;background:#e7eef4;border-radius:999px;padding:6px 11px;color:#526779}.badge.active{color:#137656;background:#e5f6ee}.badge.failed{color:#b04b3c;background:#fbeeea}.machine{margin-top:14px;display:flex;align-items:center;gap:10px;font-size:12px;color:#6b7d8b}.machine code{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;font-family:Consolas,monospace}.machine button{font-size:12px;padding:5px 9px}.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px}.mode{display:flex;gap:10px;cursor:pointer;padding:16px;border:1px solid #dbe3eb;border-radius:10px;align-items:flex-start}.mode:has(input:checked){background:#eff9f5;border-color:#329b7c}.mode input{accent-color:#16866b;margin:4px 0 0}.mode strong{font-size:15px;display:block;margin-bottom:4px}.mode small{font-size:12px;color:#6b7d8b;line-height:1.6}.rounds{margin-bottom:22px;display:flex;align-items:center;gap:14px}.rounds input{width:124px}.actions{padding-top:21px;border-top:1px solid #edf1f5;display:flex;align-items:center;gap:12px}.tip{background:#f4f8fb;color:#5d7284;border-radius:9px;padding:12px 15px;margin-top:18px;line-height:1.8;font-size:12px}kbd{font-family:inherit;color:#36516a;border:1px solid #cfdae3;border-radius:4px;background:white;padding:1px 5px}.error{font-size:13px;color:#ad4133;line-height:1.7;margin-top:12px;white-space:pre-wrap}.statusbar{display:flex;justify-content:space-between;gap:20px;margin-bottom:12px;line-height:1.7;font-size:13px}#logs{height:185px;overflow:auto;margin:0;background:#152635;border-radius:10px;color:#c7d9e6;padding:16px 18px;font:12px/1.9 Consolas,"Microsoft YaHei",monospace;white-space:pre-wrap;word-break:break-word}footer{text-align:center;color:#8293a1;font-size:12px;padding:3px 0 24px}a{color:inherit}@media(max-width:600px){main{margin:22px auto;padding:0 14px}.card{padding:20px}.modes{grid-template-columns:1fr}.row{flex-wrap:wrap}.row input{width:100%}h1{font-size:24px}.machine>span{display:none}}
</style>
</head>
<body><main>
<header><div><div class="brand">WOWREGISTER</div><h1>角色注册助手</h1></div><button class="quiet" id="quit">退出工具</button></header>
<section class="card" aria-labelledby="authTitle"><div class="row" style="justify-content:space-between;margin-bottom:16px"><h2 id="authTitle" style="margin:0">设备激活</h2><span class="badge" id="authBadge">未激活</span></div>
<form id="activateForm" class="row"><input id="card" class="grow" type="password" autocomplete="off" placeholder="输入绑定本机的卡密" aria-label="卡密"><button id="activate" class="secondary">验证并激活</button></form>
<div class="machine"><span>本机机器码</span><code id="machine">正在读取…</code><button class="secondary" id="copy">复制机器码</button></div>
<div class="error" id="authError" role="alert"></div></section>
<section class="card" aria-labelledby="runTitle"><h2 id="runTitle">运行设置</h2><form id="runForm">
<div class="modes"><label class="mode"><input type="radio" name="mode" value="1" checked><span><strong>模式 1</strong><small>7 步返回路线<br>末步前固定等待 20 秒</small></span></label><label class="mode"><input type="radio" name="mode" value="2"><span><strong>模式 2</strong><small>8 步返回路线<br>按录制流程返回起点</small></span></label></div>
<div class="rounds"><label for="repeat">运行轮数</label><input id="repeat" type="number" min="1" max="10000" step="1" value="1" required><span class="muted">首次建议先运行 1 轮</span></div>
<div class="actions"><button class="primary" id="start" disabled>启动脚本</button><button class="secondary" id="stop" type="button" disabled>停止</button><span class="badge" id="phase">待启动</span></div>
<div class="tip">点击启动后，切回游戏角色列表，按 <kbd>F6</kbd> 开始。按 <kbd>F10</kbd> 随时停止。<br>游戏客户区需为 1920 × 1080，Windows 缩放 100%；运行时请勿移动窗口或操作鼠标。</div>
<div class="error" id="runError" role="alert"></div></form></section>
<section class="card"><div class="statusbar"><span id="status">正在连接本地工具…</span><span id="progress" class="muted">0 / 1 轮</span></div><pre id="logs" role="log" aria-label="运行日志">等待启动。
</pre></section>
<footer>本机运行 · 无需安装 Python 或 ChatGPT · 关闭浏览器标签不会自动停止脚本</footer>
</main><script>
const token=__SESSION_TOKEN__;
let cursor=0,activating=false,closed=false,lines=[];
const $=id=>document.getElementById(id);
const phases={idle:'待启动',waiting:'等待 F6',running:'运行中',stopping:'正在停止',stopped:'已停止',completed:'已完成',failed:'已停止'};
async function post(path,data={}){const response=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Wowregister-Token':token},body:JSON.stringify(data)});const result=await response.json();if(!response.ok)throw new Error(result.error||'操作未完成');return result;}
async function refresh(){if(closed)return;try{const response=await fetch('/api/status?after='+cursor);if(!response.ok)throw new Error();const state=await response.json();$('status').textContent=state.message;$('progress').textContent=state.cycle+' / '+state.repeat+' 轮';$('phase').textContent=phases[state.state]||state.state;$('phase').className='badge '+(state.state==='failed'?'failed':state.busy?'active':'');$('machine').textContent=state.device_id;$('authBadge').textContent=state.authorized?'已激活':'未激活';$('authBadge').className='badge '+(state.authorized?'active':'');$('start').disabled=!state.authorized||state.busy||state.auth_busy||activating;$('stop').disabled=!state.busy;$('activate').disabled=state.busy||state.auth_busy||activating;$('card').disabled=state.busy;document.querySelectorAll('[name=mode],#repeat').forEach(item=>item.disabled=state.busy);if(state.logs.length){state.logs.forEach(line=>{cursor=line.id;lines.push(line.text)});lines=lines.slice(-1000);$('logs').textContent=lines.join('\n')+'\n';$('logs').scrollTop=$('logs').scrollHeight;}if(state.state==='failed')$('runError').textContent=state.message;}catch(error){$('status').textContent='本地工具已关闭或连接中断。';$('start').disabled=true;$('stop').disabled=true;}finally{if(!closed)setTimeout(refresh,650);}}
$('activateForm').onsubmit=async event=>{event.preventDefault();$('authError').textContent='';activating=true;$('activate').disabled=true;$('activate').textContent='正在验证…';try{await post('/api/activate',{card:$('card').value});$('card').value='';}catch(error){$('authError').textContent=error.message;}finally{activating=false;$('activate').textContent='验证并激活';}};
$('runForm').onsubmit=async event=>{event.preventDefault();$('runError').textContent='';$('start').disabled=true;try{await post('/api/start',{mode:Number(document.querySelector('[name=mode]:checked').value),repeat:Number($('repeat').value)});}catch(error){$('runError').textContent=error.message;}};
$('stop').onclick=async()=>{try{await post('/api/stop')}catch(error){$('runError').textContent=error.message}};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('machine').textContent);$('copy').textContent='已复制';setTimeout(()=>$('copy').textContent='复制机器码',1400)}catch(error){$('authError').textContent='请手动选择并复制机器码。'}};
$('quit').onclick=async()=>{try{await post('/api/quit');closed=true;$('status').textContent='工具已退出，可以关闭此页面。';document.querySelectorAll('button,input').forEach(item=>item.disabled=true)}catch(error){$('runError').textContent=error.message}};
refresh();
</script></body></html>
